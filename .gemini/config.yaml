# DEPRECATED — Gemini Code Assist is being sunset (new org installs blocked
# 2026-06-18; all review activity ceases 2026-07-17). Codex is the sole bot
# reviewer going forward; conventions now live in ../CONTRIBUTING.md. Remove
# this directory after the 2026-07-17 sunset.
have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: LOW
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false
ignore_patterns:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "**/*.lock"
  - "**/*.lockb"
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/CHANGELOG.md"
