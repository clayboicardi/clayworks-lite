name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck-and-installer-bash:
    name: shellcheck + installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the manifest check walks every commit, and
          # the upgrade test installs v1.0.1 from a worktree.
          fetch-depth: 0

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shipped-hashes manifest is current
        if: runner.os == 'Linux'
        run: |
          python3 tools/gen-shipped-hashes.py
          if ! git diff --exit-code .installer/shipped-hashes.txt; then
            echo "ERROR: .installer/shipped-hashes.txt is stale; run python3 tools/gen-shipped-hashes.py and commit the result" >&2
            exit 1
          fi

      - name: ShellCheck install.sh + tools + hook examples + Nudge launcher
        run: |
          shellcheck install.sh
          shellcheck tools/*.sh
          shellcheck plugin/hooks/examples/*.sh
          shellcheck plugin/examples/full/hooks/*.sh
          shellcheck plugin/skills/clayworks-lite-nudge/scripts/*.sh

      - name: Installer dry-run (clean target)
        run: |
          bash install.sh --dry-run --claude-dir /tmp/clayworks-test

      - name: Installer live + idempotency re-run
        run: |
          bash install.sh --claude-dir /tmp/clayworks-test
          # Re-run should report every item as skipped.
          bash install.sh --claude-dir /tmp/clayworks-test | tee out.log
          if ! grep -q "already installed and unchanged" out.log; then
            echo "ERROR: idempotency check failed — re-run did not report any item as unchanged" >&2
            exit 1
          fi
          if grep -q "differed from source" out.log; then
            echo "ERROR: idempotency check failed — re-run reinstalled an unchanged item" >&2
            exit 1
          fi

      - name: Verify expected install layout
        run: |
          ls /tmp/clayworks-test/skills/clayworks-lite-nudge/SKILL.md
          ls /tmp/clayworks-test/skills/clayworks-lite-nudge/scripts/run-python.sh
          ls /tmp/clayworks-test/skills/clayworks-lite-nudge/scripts/nudge_db.py
          ls /tmp/clayworks-test/skills/clayworks-lite-memory-routing/SKILL.md
          ls /tmp/clayworks-test/skills/clayworks-lite-heartbeat-concept/SKILL.md
          ls /tmp/clayworks-test/hooks/examples/userpromptsubmit.sh
          ls /tmp/clayworks-test/CLAUDE.md.clayworks-template
          ls /tmp/clayworks-test/settings.example.json

      - name: Uninstall after install -> nothing left
        run: |
          bash install.sh --uninstall --claude-dir /tmp/clayworks-test | tee out.log
          grep -q "Uninstall complete." out.log
          if [ -n "$(find /tmp/clayworks-test/skills /tmp/clayworks-test/hooks -type f)" ]; then
            echo "ERROR: uninstall left LITE files behind" >&2
            exit 1
          fi

      - name: Upgrade-uninstall from v1.0.1
        run: bash tools/test-upgrade-uninstall.sh v1.0.1

  ps-analyze-and-installer-windows:
    name: PSScriptAnalyzer + installer (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: the upgrade test installs v1.0.1 from a worktree.
          fetch-depth: 0

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # PSAvoidUsingWriteHost: Write-Host is the correct choice for a
          # user-facing CLI installer that needs colored output.
          # Write-Output writes to the success stream (pollutes pipelines);
          # Write-Information doesn't natively support -ForegroundColor.
          $issues = @('install.ps1', 'tools/test-upgrade-uninstall.ps1') |
            ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ `
                -Severity Error,Warning `
                -ExcludeRule PSAvoidUsingWriteHost
            }
          if ($issues) {
            $issues | Format-List
            throw "PSScriptAnalyzer found $($issues.Count) issue(s)"
          }

      - name: Installer dry-run
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP "clayworks-test"
          .\install.ps1 -DryRun -ClaudeDir $target

      - name: Installer live + idempotency re-run
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP "clayworks-test"
          .\install.ps1 -ClaudeDir $target
          $out = .\install.ps1 -ClaudeDir $target *>&1 | Out-String
          if ($out -notmatch "already installed and unchanged") {
            throw "Idempotency check failed — re-run did not report any item as unchanged"
          }
          # %TEMP% on the runner is an 8.3 short path (RUNNER~1); this guards
          # the directory-hash regression fixed in 1.1.0.
          if ($out -match "differed from source") {
            throw "Idempotency check failed — re-run reinstalled an unchanged item"
          }

      - name: Verify expected install layout
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP "clayworks-test"
          @(
            "$target\skills\clayworks-lite-nudge\SKILL.md",
            "$target\skills\clayworks-lite-nudge\scripts\run-python.sh",
            "$target\skills\clayworks-lite-nudge\scripts\nudge_db.py",
            "$target\skills\clayworks-lite-memory-routing\SKILL.md",
            "$target\skills\clayworks-lite-heartbeat-concept\SKILL.md",
            "$target\hooks\examples\userpromptsubmit.sh",
            "$target\CLAUDE.md.clayworks-template",
            "$target\settings.example.json"
          ) | ForEach-Object {
              if (-not (Test-Path -LiteralPath $_)) {
                throw "Expected file missing after install: $_"
              }
            }

      - name: Uninstall after install -> nothing left
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP "clayworks-test"
          $out = .\install.ps1 -Uninstall -ClaudeDir $target *>&1 | Out-String
          if ($out -notmatch "Uninstall complete\.") { throw "Uninstall kept items: $out" }
          $left = Get-ChildItem -LiteralPath "$target\skills", "$target\hooks" -Recurse -File -Force
          if ($left) { throw "Uninstall left LITE files behind: $($left.FullName -join ', ')" }

      # I run the upgrade test under both PowerShell 7 and Windows
      # PowerShell 5.1, the oldest version install.ps1 supports.
      - name: Upgrade-uninstall from v1.0.1 (pwsh)
        shell: pwsh
        run: ./tools/test-upgrade-uninstall.ps1 -OldRef v1.0.1

      - name: Upgrade-uninstall from v1.0.1 (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/test-upgrade-uninstall.ps1 -OldRef v1.0.1

  plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # `claude plugin validate` checks manifests, hooks/hooks.json, and skill
      # frontmatter locally. It needs no login or API key; if a future Claude
      # Code release changes that, this job fails at the validate step rather
      # than silently passing.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin, marketplace, and skills
        run: |
          claude --version
          claude plugin validate --strict ./plugin
          claude plugin validate --strict .
          claude plugin validate --strict ./plugin/skills

  nudge-scripts:
    name: Nudge scripts round trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows: the same shell Claude Code uses to run hooks.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Point Nudge at a throwaway DB
        # The runner context isn't available in a job-level env block, so I
        # export the path from a step instead.
        run: echo "CLAYWORKS_NUDGE_DB=$RUNNER_TEMP/nudge-ci/alerts.db" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax-check the Nudge scripts
        # ast.parse rather than py_compile, which would write __pycache__
        # into the skill dir and trip the check below.
        run: python -c "import ast, sys; [ast.parse(open(f, encoding='utf-8').read(), f) for f in sys.argv[1:]]" plugin/skills/clayworks-lite-nudge/scripts/*.py

      - name: DB resolver and legacy-merge scenarios
        # Plugin-cache, custom-root, import-dir, and CLAUDE_CONFIG_DIR layouts
        # in throwaway dirs; the test clears CLAYWORKS_NUDGE_DB per scenario.
        run: python -B tools/test-nudge-db.py

      - name: add -> check -> ack -> check, through the plugin hook command
        run: |
          S=plugin/skills/clayworks-lite-nudge/scripts
          export CLAUDE_PLUGIN_ROOT="$PWD/plugin"
          # Run the exact command string the plugin registers in hooks.json.
          HOOK_CMD=$(python -c "import json; print(json.load(open('plugin/hooks/hooks.json'))['hooks']['UserPromptSubmit'][0]['hooks'][0]['command'])")

          bash "$S/run-python.sh" "$S/add_alert.py" "+0m" "CI check - acknowledge me"

          out=$(eval "$HOOK_CMD")
          echo "$out"
          grep -q "ALERTS DUE:" <<< "$out"
          grep -q "CI check - acknowledge me" <<< "$out"

          bash "$S/run-python.sh" "$S/ack_alert.py" 1

          out=$(eval "$HOOK_CMD")
          if [ -n "$out" ]; then
            echo "ERROR: alert still fires after ack: $out" >&2
            exit 1
          fi

          # The launcher must not leave __pycache__ in the skill dir: the
          # installers hash that dir to detect local edits.
          if [ -d "$S/__pycache__" ]; then
            echo "ERROR: __pycache__ written into the skill dir" >&2
            exit 1
          fi

      - name: Launcher exits 0 silently when no Python exists
        run: |
          out=$(PATH=/nonexistent /bin/bash plugin/skills/clayworks-lite-nudge/scripts/run-python.sh plugin/skills/clayworks-lite-nudge/scripts/check_alerts.py; echo "rc=$?")
          test "$out" = "rc=0"
