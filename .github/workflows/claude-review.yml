name: Claude PR review

# Comment `/review [model=...] [effort=...] [focus=...] [max_tokens=...]` on a PR.
# Options and defaults: .github/review/config.json. Prompts: .github/review/prompts/.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # comments on a PR require this, not just issues: write
  issues: write # reactions on the trigger comment

# Serialize reviews per PR. queue: max keeps every pending run (up to 100)
# instead of the default of replacing all but the newest pending one.
concurrency:
  group: claude-review-${{ github.event.issue.number }}
  queue: max

jobs:
  review:
    # PR comments only, starting with /review, from the owner or a collaborator.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # above limits.deadline_seconds (40 min) so the script reports a timeout first
    steps:
      # First step on purpose: the 👀 lands within seconds, before the slower
      # checkout / Python setup / pip install. The script adds 🚀 or 😕 at the end.
      - name: Acknowledge with 👀
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes --silent \
            || echo "::warning::Could not add the 👀 reaction (check the workflow permissions)"

      # issue_comment checks out the default branch, never the PR head, so a PR
      # cannot change the reviewer script or reach the API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/review/requirements.txt

      - run: pip install -r .github/review/requirements.txt

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python .github/review/review.py
