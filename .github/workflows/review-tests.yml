name: Review bot tests

# Offline unit tests for .github/review/review.py. No secrets, no network.
on:
  pull_request:
    paths:
      - ".github/review/**"
      - ".github/workflows/review-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/review/requirements.txt

      - run: pip install -r .github/review/requirements.txt

      - run: python -m unittest discover -s .github/review -p "test_*.py" -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
